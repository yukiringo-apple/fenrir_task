<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Geolocation Sample</title>
</head>

<body>
    <div class="center">
        <div class="btn-margin">
            <button id="getLocation" class="btn btn-outline-primary btn-lg">
                現在位置を取得する
            </button>
        </div>


        <div class="txt-margin">
            <p>緯度：<span id="latitude">???</span><span>度</span></p>
            <p>経度：<span id="longitude">???</span><span>度</span></p>
        </div>
    </div>





    <div>
        <div class="">
            <select id="selectArea" class="areaRadius">
                <option value="1">300m</option>
                <option value="2">500m</option>
                <option value="3" selected>1km</option>
                <option value="4">2km</option>
                <option value="5">3km</option>

            </select>
        </div>
        <button id="buttonSearchArea">search</button>
    </div>


    <script src="./js/index.js"></script>
    <script src="./js/geolocation.js"></script>
    <script src="./js/search.js"></script>
</body>

</html>
